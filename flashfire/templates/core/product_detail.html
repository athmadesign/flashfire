{% load static %}
<!doctype html>
<html lang="en" x-data :dir="$store.appStore.dir" x-cloak>
<head>
    <meta charset="utf-8" />
    <title>{{ product.name }} | Home Cosmetics</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <meta content="" name="description" />
    <meta content="The4" name="author" />

    <!-- Favicon -->
    <link rel="shortcut icon" href="{% static 'assets/images/k_favicon_32x.png' %}">

    <!-- CSS Libraries -->
    <link href="{% static 'assets/libs/swiper/swiper-bundle.min.css' %}" rel="stylesheet">
    <link href="{% static 'assets/libs/flickity/flickity.min.css' %}" rel="stylesheet">
    <link href="{% static 'assets/libs/jarallax/jarallax.min.css' %}" rel="stylesheet">

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css?family=Libre+Baskerville:300,300i,400,400i,500,500i&display=swap" rel="stylesheet">

    <!-- Bootstrap Css -->
    <link rel="stylesheet" href="{% static 'assets/css/bootstrap.min.css' %}">
    <!-- Icons Css -->
    <link href="{% static 'assets/css/icons.min.css' %}" rel="stylesheet">
    <link href="{% static 'assets/icons/font-icon.css' %}" rel="stylesheet">
    <!-- App Css -->
    <link href="{% static 'assets/css/app.min.css' %}" id="app-style" rel="stylesheet">

    <style>
        /* Custom Styles for Product Page */
        .product-main-img {
            width: 100%;
            height: 400px;
            object-fit: cover;
            border-radius: 8px;
        }
        .product-thumbs div {
            width: 60px;
            height: 60px;
            cursor: pointer;
            border-radius: 6px;
            border: 1px solid #ddd;
            transition: transform 0.2s, border-color 0.2s;
        }
        .product-thumbs div:hover {
            transform: scale(1.1);
            border-color: #333;
        }
        @media (max-width: 768px) {
            .product-main-img {
                height: 300px;
            }
            .product-thumbs div {
                width: 50px;
                height: 50px;
            }
        }
    </style>
</head>

<body class="wrapper_cus">

<section class="product-details-page py-5">
    <div class="container">

        <div class="row g-4 align-items-start">

            <!-- LEFT: Product Images -->
            <div class="col-12 col-lg-6">
                <div x-data="{ imageUrl: '{{ product.image.url }}' }" class="w-100">

                    <!-- Main Image -->
                    <img :src="imageUrl"
                         alt="{{ product.name }}"
                         class="product-main-img mb-3">

                    <!-- Thumbnails -->
                    <div class="d-flex gap-3 flex-wrap product-thumbs">

                        <!-- First Image -->
                        <div
                            @mouseover="imageUrl='{{ product.image.url }}'"
                            style="background:url('{{ product.image.url }}') center/cover;">
                        </div>

                        <!-- Second Image -->
                        {% if product.image2 %}
                        <div
                            @mouseover="imageUrl='{{ product.image2.url }}'"
                            style="background:url('{{ product.image2.url }}') center/cover;">
                        </div>
                        {% endif %}

                    </div>

                </div>
            </div>

            <!-- RIGHT: Product Details -->
            <div class="col-12 col-lg-6">

                <!-- Title -->
                <h2 class="mb-3">{{ product.name }}</h2>

                <!-- Price -->
                <p class="text-muted fs-4 mb-3">${{ product.price }}</p>

                <!-- Trending / New badge -->
                {% if product.trending %}
                <span class="badge bg-danger mb-3">🔥 Trending</span>
                {% elif product.new_arrival %}
                <span class="badge bg-success mb-3">🆕 New Arrival</span>
                {% endif %}

                <!-- Description -->
                <h5 class="fw-bold mt-3">Description</h5>
                <p class="text-muted">{{ product.description }}</p>

                <!-- Buttons -->
                <div class="d-flex flex-wrap gap-2 mt-3">
                    <button data-bs-toggle="offcanvas" href="#shoppingCartOffcanvas"
                            class="btn btn-dark px-4 py-2">
                        <i class="iccl iccl-cart"></i> BUY NOW
                    </button>

                    <a href="/product/" class="btn btn-outline-secondary px-4 py-2">
                        Back to Products
                    </a>
                </div>

            </div>

        </div>

    </div>
</section>

<!-- JS Libraries -->
<script src="{% static 'assets/libs/jquery/jquery.min.js' %}"></script>
<script src="{% static 'assets/js/store.js' %}"></script>
<script src="{% static 'assets/libs/jarallax/jarallax.min.js' %}"></script>
<script src="{% static 'assets/libs/swiper/swiper-bundle.min.js' %}"></script>
<script src="{% static 'assets/libs/alpinejs/cdn.min.js' %}"></script>
<script src="{% static 'assets/libs/jquery-countdown/jquery.countdown.min.js' %}"></script>
<script src="{% static 'assets/libs/bootstrap/js/bootstrap.bundle.min.js' %}"></script>
<script src="{% static 'assets/js/product-slider.init.js' %}"></script>
<script src="{% static 'assets/js/popup.js' %}"></script>
<script src="{% static 'assets/libs/flickity/flickity.pkgd.min.js' %}"></script>
<script src="{% static 'assets/js/main.js' %}"></script>
<script src="{% static 'assets/js/app.js' %}"></script>

</body>
</html>
